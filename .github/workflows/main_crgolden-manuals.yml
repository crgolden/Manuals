name: Build and deploy ASP.Net Core app to Azure Web App - crgolden-manuals

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  sync-lock-files:
    name: Sync Dependabot lock files
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        if: github.actor == 'dependabot[bot]'
        with:
          ref: ${{ github.head_ref }}

      - name: Set up .NET Core
        if: github.actor == 'dependabot[bot]'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Regenerate lock files and push
        if: github.actor == 'dependabot[bot]'
        env:
          HEAD_REF: ${{ github.head_ref }}
        shell: powershell
        run: |
          dotnet restore --force-evaluate
          if (-not (git status --porcelain -- '*packages.lock.json')) {
            Write-Output 'Lock files already consistent; nothing to push.'
            exit 0
          }
          git config user.name 'dependabot[bot]'
          git config user.email '49699333+dependabot[bot]@users.noreply.github.com'
          git add -- '*packages.lock.json'
          git commit -m 'Regenerate packages.lock.json for transitive project references'
          git push origin "HEAD:$env:HEAD_REF"

  build:
    name: Build and analyze
    needs: sync-lock-files
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Set up JDK 21
        if: github.actor != 'dependabot[bot]'
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'zulu'

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.actor == 'dependabot[bot]' && github.head_ref || '' }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Cache SonarQube Cloud packages
        if: github.actor != 'dependabot[bot]'
        uses: actions/cache@v5
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        if: github.actor != 'dependabot[bot]'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true' && github.actor != 'dependabot[bot]'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Cache dotnet global tools
        id: cache-dotnet-tools
        uses: actions/cache@v5
        with:
          path: ~/.dotnet/tools
          key: ${{ runner.os }}-dotnet-tools-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-dotnet-tools-

      - name: Install dotnet-coverage
        if: steps.cache-dotnet-tools.outputs.cache-hit != 'true'
        run: dotnet tool install --global dotnet-coverage

      - name: Begin Sonar analysis
        if: github.actor != 'dependabot[bot]'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        shell: powershell
        run: |
          ${{ runner.temp }}\scanner\dotnet-sonarscanner begin `
            /k:"$env:SONAR_PROJECT_KEY" `
            /o:"$env:SONAR_ORGANIZATION" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.cs.opencover.reportsPaths="coverage.opencover.xml" `
            /d:sonar.cs.vscoveragexml.reportsPaths="coverage-integration.xml" `
            /d:sonar.exclusions="**/bin/**,**/obj/**" `
            /d:sonar.coverage.exclusions="**/Program.cs" `
            /d:sonar.qualitygate.wait=true `
            /d:sonar.scanner.skipJreProvisioning=true

      - name: Build with dotnet
        env:
          NuGetPackageSourceCredentials_GitHub: Username=${{ github.actor }};Password=${{ secrets.PACKAGES_READ_TOKEN }}
        run: dotnet build --no-incremental --configuration Release /p:RestoreLockedMode=true -warnaserror

      - name: Restore local tools
        run: dotnet tool restore

      - name: ReSharper inspection (jb inspectcode)
        run: |
          dotnet jb inspectcode Manuals.slnx --no-build -e=WARNING --output=inspectcode.sarif
          $results = @((Get-Content inspectcode.sarif -Raw | ConvertFrom-Json).runs | ForEach-Object { $_.results })
          foreach ($result in $results) {
            $location = $result.locations[0].physicalLocation
            Write-Output "::error file=$($location.artifactLocation.uri),line=$($location.region.startLine)::$($result.ruleId) $($result.message.text)"
          }
          if ($results.Count -gt 0) { exit 1 }

      - name: Run unit tests with coverage
        run: |
          dotnet coverlet Manuals.Tests.Unit\bin\Release\net10.0 `
            --target "dotnet" `
            --targetargs "test --project Manuals.Tests.Unit --no-build --configuration Release -- --filter-trait Category=Unit --stop-on-fail on --report-xunit-trx --report-xunit-trx-filename unit-tests.trx --results-directory=Manuals.Tests.Unit/bin/Release/net10.0/TestResults" `
            --format opencover --output "coverage.opencover.xml" `
            --skipautoprops `
            --exclude-by-attribute GeneratedCodeAttribute `
            --exclude-by-file "**/obj/**" `
            --exclude-by-file "**/Program.cs" `
            --does-not-return-attribute DoesNotReturnAttribute `
            --include "[Manuals]*"

      - name: Run integration tests with coverage
        if: github.event_name != 'pull_request'
        id: integration
        env:
          ASPNETCORE_ENVIRONMENT: CI
          OidcAuthority: ${{ vars.OIDC_AUTHORITY }}
          RedisHost: ${{ vars.REDIS_HOST }}
          RedisPort: ${{ vars.REDIS_PORT }}
          RedisSsl: true
          RedisPassword: ${{ secrets.REDIS_PASSWORD }}
          RedisDatabase: ${{ vars.REDIS_DATABASE_TEST }}
          OpenAIEndpoint: ${{ vars.OPENAI_ENDPOINT }}
          OpenAIModel: ${{ vars.OPENAI_MODEL }}
          OpenAIMaxOutputTokenCount: ${{ vars.OPENAI_MAX_OUTPUT_TOKEN_COUNT }}
          OpenAIInstructions: ${{ vars.OPENAI_INSTRUCTIONS }}
          OpenAIApiKey: ${{ secrets.OPENAI_API_KEY }}
          IntegrationPrompts__ManualRequestFormat: ${{ vars.INTEGRATION_PROMPTS_MANUAL_REQUEST_FORMAT }}
          IntegrationPrompts__RecallProduct: ${{ vars.INTEGRATION_PROMPTS_RECALL_PRODUCT }}
        run: |
          dotnet-coverage collect `
            "dotnet test --project Manuals.Tests.Integration --no-build --configuration Release -- --filter-trait Category=Integration --stop-on-fail on --report-xunit-trx --report-xunit-trx-filename integration-tests.trx --results-directory=Manuals.Tests.Integration/bin/Release/net10.0/TestResults" `
            -f xml -o "coverage-integration.xml" -s "coverage.settings.xml"

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          if-no-files-found: error
          path: |
            Manuals.Tests.Unit/bin/Release/net10.0/TestResults/
            Manuals.Tests.Integration/bin/Release/net10.0/TestResults/

      - name: dotnet publish
        env:
          NuGetPackageSourceCredentials_GitHub: Username=${{ github.actor }};Password=${{ secrets.PACKAGES_READ_TOKEN }}
        run: >
          dotnet publish Manuals/Manuals.csproj
          -c Release
          -r win-x86
          --self-contained false
          -o ${{ github.workspace  }}\publish

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v7
        with:
          name: .net-app
          path: ${{ github.workspace }}\publish

      - name: End Sonar analysis
        if: github.actor != 'dependabot[bot]'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          ${{ runner.temp }}\scanner\dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"

  deploy:
    runs-on: windows-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v7
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca  # v3.0.1
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8DE5AD040E9A48B5ABB987D909C873E4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C329C8261C3244ACB850928362690ADC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B09849552EEF4A26B6234A3254D8CEC1 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383  # v3.0.8
        with:
          app-name: 'crgolden-manuals'
          slot-name: 'Production'
          package: .

